<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Salud del Adulto - Enfermería</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 50%, #80cbc4 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #1e293b;
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header .title-group {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }
        header h1 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; color: #00695c;}
        header p { color: #00897b; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        
        .progress-wrapper {
            display: flex; align-items: center; gap: 20px;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
            padding: 10px 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.8);
        }
        .progress-container { width: 200px; height: 8px; background: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden;}
        .progress-bar { height: 100%; background: linear-gradient(90deg, #00897b, #26a69a); width: 0%; transition: width 0.5s ease;}
        .slide-counter { font-weight: 800; color: #00695c; font-size: 1rem;}

        .swiper { width: 100%; height: 100vh; z-index: 10; }
        .swiper-slide { display: flex; justify-content: center; align-items: center; padding: 60px 40px 20px 40px;}

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px; 
            width: 100%; max-width: 1300px; height: 80vh;
            display: flex; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 105, 92, 0.15);
            opacity: 0; transform: translateY(50px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .swiper-slide-active .glass-card { opacity: 1; transform: translateY(0) scale(1); }

        .card-content { flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
        .card-media { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 30px;}
        
        .icon-box { 
            width: 70px; height: 70px; border-radius: 20px; 
            background: linear-gradient(135deg, #26a69a, #00897b); 
            display: flex; justify-content: center; align-items: center; 
            font-size: 2rem; color: #fff; margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 137, 123, 0.3);
            transform: translateY(20px); opacity: 0; transition: all 0.6s 0.3s ease;
        }
        .swiper-slide-active .icon-box { transform: translateY(0); opacity: 1; }

        h2 { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 800; color: #0f172a; margin-bottom: 25px; line-height: 1.1; letter-spacing: -1px; transform: translateY(20px); opacity: 0; transition: all 0.6s 0.4s ease;}
        .swiper-slide-active h2 { transform: translateY(0); opacity: 1; }

        p.text-body { font-size: 1.3rem; line-height: 1.8; color: #334155; transform: translateY(20px); opacity: 0; transition: all 0.6s 0.5s ease;}
        .swiper-slide-active p.text-body { transform: translateY(0); opacity: 1; }
        
        .highlight { color: #00695c; font-weight: 700; background: rgba(38, 166, 154, 0.2); padding: 4px 12px; border-radius: 8px;}
        .source-tag { display: inline-block; margin-top: 30px; font-size: 0.9rem; font-weight: 600; color: #64748b; background: rgba(255,255,255,0.8); padding: 8px 16px; border-radius: 20px; border: 1px solid #cbd5e1; transform: translateY(20px); opacity: 0; transition: all 0.6s 0.6s ease;}
        .swiper-slide-active .source-tag { transform: translateY(0); opacity: 1; }

        .med-img { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); transition: transform 0.5s ease; border: 4px solid #fff; background-color: #e2e8f0;}
        .med-img:hover { transform: scale(1.05); }

        .fallback-img { width: 100%; height: 100%; border-radius: 24px; background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1)); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; font-size: 5rem; color: #00897b; box-shadow: inset 0 10px 20px rgba(0,0,0,0.05); border: 4px solid rgba(255,255,255,0.6); transition: transform 0.5s ease; }
        .fallback-img:hover { transform: scale(1.03); }

        .layout-a .card-content { flex: 1.2; }
        .layout-a .card-media { flex: 0.8; padding: 40px; }
        
        .layout-b { flex-direction: row-reverse; }
        .layout-b .card-content { flex: 1; background: rgba(255,255,255,0.4); border-left: 1px solid rgba(255,255,255,0.6);}
        .layout-b .card-media { flex: 1; padding: 40px; }

        .layout-c .card-content { flex: 1.3; }
        .layout-c .card-media { flex: 0.7; display: flex; flex-direction: column; gap: 20px; padding: 30px; }
        .layout-c .card-media .med-img, .layout-c .card-media .fallback-img { height: 50%; }

        .cover-card { flex-direction: column; text-align: center; justify-content: center; align-items: center; padding: 40px; border-top: 10px solid #00897b; background: rgba(255,255,255,0.85);}
        .cover-card h1 { font-family: 'Outfit', sans-serif; font-size: 4.5rem; color: #00695c; margin-bottom: 10px; line-height: 1;}
        .cover-card h3 { font-size: 1.8rem; color: #26a69a; margin-bottom: 50px; text-transform: uppercase; letter-spacing: 3px; font-weight: 600;}
        
        .info-pill-container { display: flex; gap: 30px; margin-bottom: 40px;}
        .info-pill { background: #fff; padding: 20px 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: left; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px;}
        .info-pill strong { color: #00695c; font-family: 'Outfit'; font-size: 1.1rem;}

        .team-box { background: linear-gradient(135deg, #00695c, #00897b); padding: 30px 50px; border-radius: 25px; display: inline-block; color: white; box-shadow: 0 15px 30px rgba(0, 105, 92, 0.3);}
        .team-box h4 { font-size: 1.3rem; margin-bottom: 20px; font-weight: 700;}
        .team-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; list-style: none;}
        .team-list li { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 12px 25px; border-radius: 30px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3);}

        .chart-wrapper { width: 100%; height: 450px; display: flex; justify-content: center; align-items: center; background: #fff; border-radius: 20px; padding: 20px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.02);}
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>PROGRAMA DE SALUD DEL ADULTO</h1>
            <p>Atención Integral de Enfermería</p>
        </div>
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="pBar"></div>
            </div>
            <div class="slide-counter" id="counter">01 / 80</div>
        </div>
    </header>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="slide-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        const dataSlides = [
            { type: 'cover' },
            { type: 'chart-bar' },
            { type: 'chart-pie' },
            { i: "fa-scale-balanced", t: "04. Base Normativa", p: "La atención integral del adulto está regida por la NTS N.° 229-MINSA/DGIESP-2025.", cat: "normativa" },
            { i: "fa-users-viewfinder", t: "05. Población Objetivo", p: "La normativa establece intervenciones obligatorias dirigidas a personas adultas comprendidas entre los <span class='highlight'>30 a 59 años, 11 meses y 29 días de edad</span>.", cat: "normativa" },
            { i: "fa-bullseye", t: "06. Objetivo General", p: "Establecer las disposiciones técnicas y administrativas para el cuidado integral de salud de la persona adulta en los establecimientos.", cat: "normativa" },
            { i: "fa-list-check", t: "07. Objetivos Específicos", p: "Estandarizar criterios técnicos y administrativos para brindar el paquete de cuidado integral según las necesidades y riesgos identificados.", cat: "normativa" },
            { i: "fa-hand-holding-hand", t: "08. Enfoque de Derechos", p: "Garantizar la igualdad de trato y la no discriminación, respetando la dignidad y autonomía del paciente durante toda su atención.", cat: "derechos" },
            { i: "fa-earth-americas", t: "09. Enfoque Intercultural", p: "Brindar servicios con pertinencia cultural, integrando el conocimiento tradicional y respetando las creencias de las diversas comunidades.", cat: "derechos" },
            { i: "fa-venus-mars", t: "10. Equidad de Género", p: "Promover servicios diferenciados que aborden las problemáticas específicas de mujeres y varones para eliminar la discriminación.", cat: "derechos" },
            { i: "fa-person-walking", t: "11. Curso de Vida", p: "Reconocer que las condiciones y comportamientos desarrollados en la adultez influirán directamente en el estado de salud durante la vejez.", cat: "general" },
            { i: "fa-map-location-dot", t: "12. Enfoque Territorial", p: "Articular esfuerzos con actores sociales y políticos locales para abordar efectivamente los determinantes sociales de la salud en la comunidad.", cat: "general" },
            { i: "fa-hospital-user", t: "13. Captación Clínica", p: "La identificación del adulto puede realizarse en oferta fija, oferta móvil, telesalud o a través del trabajo de los agentes comunitarios.", cat: "enfermeria" },
            { i: "fa-id-card", t: "14. Proceso de Admisión", p: "Apertura de la Historia Clínica y Ficha Familiar, verificación de afiliación (SIS) y entrega del Carnet de Cuidado Integral de Salud.", cat: "enfermeria" },
            { i: "fa-stethoscope", t: "15. Triaje de Enfermería", p: "Identificación de signos de alarma, toma de medidas antropométricas (peso, talla, PAB) y control estricto de funciones vitales.", cat: "enfermeria" },
            { i: "fa-notes-medical", t: "16. Plan de Cuidado", p: "Instrumento elaborado en la primera consulta que programa la provisión de servicios según los riesgos sanitarios identificados en el paciente.", cat: "enfermeria" },
            { i: "fa-chalkboard-user", t: "17. Educación Sanitaria", p: "Herramienta clave en enfermería para proporcionar información clara, permitiendo al adulto tomar decisiones favorables para su bienestar.", cat: "enfermeria" },
            { i: "fa-shield-heart", t: "18. Autocuidado Activo", p: "El programa busca que el adulto reconozca factores de riesgo, adopte medidas preventivas y participe activamente en el cuidado de su salud.", cat: "nutricion" },
            { i: "fa-house-chimney-medical", t: "19. Determinantes Sociales", p: "La atención integral no solo aborda el aspecto físico, sino las condiciones sociales, económicas, culturales y ambientales del individuo.", cat: "normativa" },
            { i: "fa-infinity", t: "20. Cuidado Continuo", p: "El enfoque actual del MINSA busca no esperar a que aparezca la enfermedad, sino intervenir anticipadamente mediante tamizajes y seguimiento.", cat: "enfermeria" },
            { i: "fa-heart-pulse", t: "21. Promoción de la Salud", p: "Componente orientado a empoderar a la población adulta para que asuma el control sobre su salud mediante prácticas y entornos saludables.", cat: "nutricion" },
            { i: "fa-apple-whole", t: "22. Alimentación Saludable", p: "Orientación sobre dietas equilibradas. Promueve la reducción del consumo de azúcares, sodio y alimentos ultraprocesados.", cat: "nutricion" },
            { i: "fa-person-running", t: "23. Actividad Física", p: "Medida preventiva esencial frente a factores de riesgo crónicos (cardiovasculares, diabetes) que contribuye al control del peso corporal.", cat: "nutricion" },
            { i: "fa-hands-bubbles", t: "24. Higiene Personal", p: "Fomento sistemático del lavado de manos adecuado, higiene bucal, cuidado de la piel y mantenimiento de condiciones salubres en la vivienda.", cat: "higiene" },
            { i: "fa-car-burst", t: "25. Seguridad Vial", p: "Promoción de comportamientos responsables y cultura de tránsito para disminuir significativamente los riesgos de lesiones y accidentes.", cat: "general" },
            { i: "fa-ribbon", t: "26. Salud Sexual", p: "Educación para la prevención de ITS, embarazos no planificados, orientación sobre métodos anticonceptivos y salud reproductiva.", cat: "sexual" },
            { i: "fa-ban-smoking", t: "27. Prevención del Tabaco", p: "Enfermería debe identificar el consumo, brindar consejería sobre los daños y facilitar el acceso a servicios para abandonar el hábito.", cat: "mental" },
            { i: "fa-wine-glass-empty", t: "28. Consumo de Alcohol", p: "Uso de instrumentos de tamizaje para detectar conductas perjudiciales tempranas y derivar al adulto a atención especializada.", cat: "mental" },
            { i: "fa-triangle-exclamation", t: "29. Identificación de Riesgos", p: "Reconocer condiciones (alimentación, sedentarismo, antecedentes familiares) que aumentan la posibilidad de desarrollar enfermedades crónicas.", cat: "cardio" },
            { i: "fa-box-archive", t: "30. Paquete Priorizado", p: "Conjunto de intervenciones enfocadas en mantener la salud y detectar de forma temprana riesgos relacionados con enfermedades no transmisibles.", cat: "cardio" },
            { i: "fa-virus-slash", t: "31. Enfermedades No Transmisibles", p: "Afecciones de larga duración (Diabetes, HTA) que representan el principal problema de salud pública y morbilidad en el adulto.", cat: "cardio" },
            { i: "fa-heart-circle-exclamation", t: "32. Hipertensión Arterial", p: "Requiere control periódico ya que puede permanecer asintomática por años, elevando silenciosamente el riesgo de accidentes cardiovasculares.", cat: "cardio" },
            { i: "fa-droplet", t: "33. Diabetes Mellitus 2", p: "Se indica la evaluación de glucosa basada en la edad y presencia de factores como obesidad o antecedentes familiares de diabetes.", cat: "cardio" },
            { i: "fa-weight-scale", t: "34. Obesidad y Riesgo", p: "La acumulación excesiva de grasa, evaluada mediante el IMC, es el factor detonante para enfermedades cardiovasculares y metabólicas.", cat: "nutricion" },
            { i: "fa-pills", t: "35. Adherencia Terapéutica", p: "La familia y el personal apoyan la adherencia; se educa al paciente para que no suspenda ni modifique tratamientos por cuenta propia.", cat: "enfermeria" },
            { i: "fa-microscope", t: "36. Tamizajes Oportunos", p: "Las evaluaciones y tamizajes permiten identificar tempranamente riesgos. Facilitan la orientación, tratamiento o seguimiento especializado.", cat: "laboratorio" },
            { i: "fa-ruler", t: "37. Evaluación Antropométrica", p: "Permite clasificar el estado nutricional del paciente mediante el cálculo del IMC y detectar situaciones de riesgo metabólico crónico.", cat: "laboratorio" },
            { i: "fa-tape", t: "38. Perímetro Abdominal", p: "Procedimiento clave. El aumento del perímetro abdominal se relaciona con mayor riesgo de diabetes tipo 2 e hipertensión arterial.", cat: "laboratorio" },
            { i: "fa-vial", t: "39. Glucosa en Sangre", p: "Prueba de laboratorio (azar, ayunas o tolerancia) para detectar alteraciones del metabolismo de la glucosa en pacientes de riesgo.", cat: "laboratorio" },
            { i: "fa-vial-circle-check", t: "40. Perfil Lipídico", p: "Examen en sangre venosa que mide Colesterol total, HDL, triglicéridos y LDL para identificar dislipidemias peligrosas.", cat: "laboratorio" },
            { i: "fa-ribbon", t: "41. Prevención Oncológica", p: "Intervenciones dirigidas a la prevención y detección temprana de cáncer de cuello uterino, mama, próstata, colon y piel.", cat: "cancer" },
            { i: "fa-person-dress", t: "42. Cáncer Cuello Uterino", p: "Estrechamente ligado a la infección persistente por Virus del Papiloma Humano (VPH). Su prevención incluye tamizajes y educación.", cat: "cancer" },
            { i: "fa-microscope", t: "43. Papanicolaou (PAP)", p: "Prueba de citología cervicouterina indispensable para detectar cambios celulares precancerosos de manera temprana en la mujer adulta.", cat: "cancer" },
            { i: "fa-eye", t: "44. Inspección IVAA", p: "Aplicación clínica de ácido acético sobre el cuello uterino que permite la observación directa de alteraciones sospechosas.", cat: "cancer" },
            { i: "fa-dna", t: "45. Detección Molecular VPH", p: "Prueba avanzada que identifica los genotipos de VPH de alto riesgo asociados al desarrollo de lesiones oncológicas.", cat: "cancer" },
            { i: "fa-person-breastfeeding", t: "46. Cáncer de Mama", p: "La prevención exige educación para el reconocimiento de cambios en las mamas, examen clínico anual y mamografía bianual preventiva.", cat: "cancer" },
            { i: "fa-x-ray", t: "47. Tamizaje Mamográfico", p: "Estudio radiológico especializado para identificar microcalcificaciones y signos no palpables sugestivos de cáncer de mama.", cat: "cancer" },
            { i: "fa-person", t: "48. Cáncer de Próstata", p: "Evaluación médica en hombres que incluye palpación digital y dosaje de antígeno (PSA), considerando la edad y antecedentes.", cat: "cancer" },
            { i: "fa-disease", t: "49. Cáncer Colorrectal", p: "Estrategia preventiva basada en el examen clínico y la indicación de la prueba de sangre oculta en heces para detección precoz.", cat: "cancer" },
            { i: "fa-sun", t: "50. Cáncer de Piel", p: "Evaluación médica preventiva que sigue la regla ABCDE (Asimetría, Borde, Color, Diámetro, Evolución) para examinar lesiones.", cat: "cancer" },
            { i: "fa-brain", t: "51. Salud Mental", p: "Es un componente obligatorio del cuidado integral. Identifica problemas que afectan el bienestar emocional, familiar y laboral.", cat: "mental" },
            { i: "fa-face-frown", t: "52. Trastornos Depresivos", p: "Aplicación del Cuestionario PHQ-9 (9 ítems) para obtener un diagnóstico provisional y valorar la severidad de los síntomas depresivos.", cat: "mental" },
            { i: "fa-martini-glass-empty", t: "53. Consumo de Alcohol", p: "Evaluación mediante el test AUDIT-C. En hombres un puntaje ≥4 es positivo; en mujeres, ≥3 indica consumo perjudicial o abuso.", cat: "mental" },
            { i: "fa-hand-fist", t: "54. Prevención de Violencia", p: "Detección de violencia física o psicológica. Enfermería mantiene escucha activa y deriva a redes de protección social.", cat: "mental" },
            { i: "fa-clipboard-question", t: "55. Tamizaje WAST", p: "Herramienta de detección de violencia. Un puntaje total igual o mayor a 15 confirma un caso positivo que requiere intervención.", cat: "mental" },
            { i: "fa-comments", t: "56. Orientación Emocional", p: "Ante un tamizaje con resultado de riesgo, el paciente recibe consejería y es derivado oportunamente a servicios de salud mental.", cat: "mental" },
            { i: "fa-user-lock", t: "57. Confidencialidad", p: "Todo procedimiento de tamizaje mental y detección de violencia exige estricta privacidad y protección de datos del paciente.", cat: "mental" },
            { i: "fa-eye", t: "58. Salud Ocular", p: "Examen para determinar la agudeza visual y detectar errores refractivos o enfermedades externas del ojo en la adultez.", cat: "dental" },
            { i: "fa-tooth", t: "59. Examen Bucal", p: "Evaluación estomatológica preventiva: revisión de encías, caries, edentulismo e instrucción en técnicas de higiene oral fluorada.", cat: "dental" },
            { i: "fa-virus", t: "60. Enfermedades Infecciosas", p: "Promoción de la prevención, consejería y tamizaje diagnóstico para sífilis y VIH en la población adulta sexualmente activa.", cat: "vacunas" },
            { i: "fa-lungs", t: "61. Control de Tuberculosis", p: "Identificación prioritaria de sintomáticos respiratorios (tos por más de 15 días) para el examen inmediato y diagnóstico precoz.", cat: "vacunas" },
            { i: "fa-mosquito", t: "62. Zoonosis y Metaxénicas", p: "Detección y diagnóstico oportuno ante sospechas de dengue u otras enfermedades según el escenario de riesgo epidemiológico local.", cat: "vacunas" },
            { i: "fa-syringe", t: "63. Esquema de Vacunación", p: "Garantizar la protección del adulto mediante la administración de vacunas oficiales: Antitetánica, Influenza, Neumococo y Hepatitis B.", cat: "vacunas" },
            { i: "fa-baby", t: "64. Planificación Familiar", p: "Consejería y administración de métodos anticonceptivos (orales, inyectables) promoviendo decisiones informadas y voluntarias.", cat: "sexual" },
            { i: "fa-user-nurse", t: "65. Salud Ocupacional", p: "Vigilancia e identificación de enfermedades ocupacionales y factores de riesgo físicos o químicos presentes en el entorno laboral.", cat: "enfermeria" },
            { i: "fa-user-doctor", t: "66. Rol de Enfermería", p: "Función esencial en el cuidado integral. Participa en promoción, prevención, detección de riesgos, seguimiento y recuperación.", cat: "enfermeria" },
            { i: "fa-clipboard-user", t: "67. Valoración Integral", p: "La primera intervención de enfermería que recopila enfermedades previas, antecedentes familiares y estado general del adulto.", cat: "enfermeria" },
            { i: "fa-heart-pulse", t: "68. Control de Signos Vitales", p: "La medición de la presión arterial, frecuencia cardíaca y respiratoria requiere técnica precisa e instrumental médico calibrado.", cat: "enfermeria" },
            { i: "fa-bullhorn", t: "69. Comunicación Educativa", p: "Enfermería utiliza un lenguaje sencillo y respetuoso, verificando que el paciente comprenda cabalmente las indicaciones clínicas.", cat: "enfermeria" },
            { i: "fa-hands-holding-circle", t: "70. Participación en Tamizajes", p: "El profesional prepara a la persona, orienta sobre los procedimientos (como el Papanicolaou) y ejecuta el seguimiento de resultados.", cat: "enfermeria" },
